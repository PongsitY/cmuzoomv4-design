<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to · CMU ZOOM</title>
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<body>
  <main class="landing">
    <div class="landing-media">
      <picture>
        <source media="(max-width: 767px)" srcset="../images/bg-full.png">
        <source media="(max-width: 1199px) and (orientation: portrait)" srcset="../images/bg-crop-5-4.png">
        <img src="../images/bg-4-3.png" alt="" width="1200" height="896">
      </picture>
    </div>

    <section class="landing-panel">
      <div class="landing-toolbar">
        <div class="segmented" role="group" data-i18n-aria-label="menu.language">
          <button type="button" data-set-lang="en">EN</button>
          <button type="button" data-set-lang="th">TH</button>
        </div>
        <button type="button" class="icon-button" data-toggle-theme data-i18n-aria-label="menu.theme">
          <svg class="icon theme-icon-light" aria-hidden="true"><use href="#i-moon"></use></svg>
          <svg class="icon theme-icon-dark" aria-hidden="true"><use href="#i-sun"></use></svg>
        </button>
      </div>

      <div class="landing-main">
      <div class="logo-row">
        <img class="logo-cmu" src="../images/logo-cmu.png" alt="Chiang Mai University" width="100" height="100">
        <span class="logo-divider" aria-hidden="true"></span>
        <img class="logo-tlic" src="../images/logo-tlic.png" alt="Teaching and Learning Innovation Center" width="200" height="40">
        <span class="logo-divider" aria-hidden="true"></span>
        <img class="logo-zoom" src="../images/logo-zoom.png" alt="Zoom" width="150" height="35">
      </div>

      <div class="landing-content">
        <p class="landing-welcome" data-i18n="landing.welcome">Welcome to</p>
        <h1 class="landing-title">CMU ZOOM</h1>
        <p class="landing-subtitle" data-i18n="landing.subtitle">Video conferencing for Chiang Mai University students and staff.</p>

        <div class="landing-actions">
          <a class="btn btn-primary btn-lg btn-block" href="profile.html" data-login>
            <svg class="icon" aria-hidden="true"><use href="#i-log-in"></use></svg>
            <span data-i18n="landing.login">Login with CMU Account</span>
          </a>
          <!-- Sign-in failure from the OAuth callback (?error=…); filled by the script below. -->
          <p class="field-error" role="alert" data-landing-error hidden></p>
          <p class="landing-note" data-i18n="landing.note">Sign in with your @cmu.ac.th account.</p>
        </div>
      </div>
      </div>

      <p class="landing-footer" data-i18n="landing.footer">Teaching and Learning Innovation Center, Chiang Mai University</p>
    </section>
  </main>

  <script>
    'use strict';
    // Production app/pages/index.vue: each ?error= reason has its own message; unknown -> generic.
    (function () {
      const ERROR_MESSAGES = Object.freeze({
        'not-provisioned': 'landing.errorNotProvisioned',
        'blocked-account-type': 'landing.errorAccountType',
        inactive: 'landing.errorInactive',
        'no-email': 'landing.errorGeneric',
        'login-failed': 'landing.errorGeneric',
        unavailable: 'landing.errorUnavailable'
      });
      const GENERIC_ERROR = 'landing.errorGeneric';
      const TITLE_SUFFIX = ' · CMU ZOOM';

      try {
        const reason = new URLSearchParams(window.location.search).get('error');
        const line = document.querySelector('[data-landing-error]');
        if (reason !== null && line) {
          // Set before app.js applies translations on DOMContentLoaded, so it follows the language.
          line.dataset.i18n = Object.prototype.hasOwnProperty.call(ERROR_MESSAGES, reason)
            ? ERROR_MESSAGES[reason]
            : GENERIC_ERROR;
          line.hidden = false;
        }
      } catch (error) {
        console.error('[landing] Unable to read the sign-in error', error);
      }

      // Production title: "{landing.welcome} · CMU ZOOM".
      const renderTitle = () => {
        document.title = `${window.App.t('landing.welcome')}${TITLE_SUFFIX}`;
      };
      document.addEventListener('DOMContentLoaded', renderTitle);
      document.addEventListener(window.App.EVENTS.LANG, renderTitle);
    })();
  </script>
</body>
</html>
