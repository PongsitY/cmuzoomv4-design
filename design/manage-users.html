<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Users · CMU ZOOM</title>
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="assets/vendor/driver.js/driver.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/pool-holders.js" defer></script>
  <script src="assets/js/manage-users.js" defer></script>
  <script src="assets/vendor/driver.js/driver.js.iife.js" defer></script>
  <script src="assets/js/tours.js" defer></script>
</head>
<body data-demo-switcher data-page="manage-users">
  <!-- ===== Navbar (shared with profile.html) ===== -->
  <header class="navbar">
    <div class="navbar-inner">
      <a class="brand" href="profile.html" data-i18n-aria-label="nav.home">
        <img src="../images/logo-tlic.png" alt="TLIC" width="200" height="85">
      </a>

      <nav class="nav-links" data-i18n-aria-label="nav.primary">
        <a class="nav-link" href="booking.html">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-calendar-check"></use></svg>
          <span data-i18n="nav.booking">Booking Center</span>
        </a>
        <a class="nav-link" href="manage-users.html" aria-current="page" data-admin-only>
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-users"></use></svg>
          <span data-i18n="menu.manageUsers">Manage Users</span>
        </a>
        <a class="nav-link" href="manage-admins.html" data-global-only>
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-shield"></use></svg>
          <span data-i18n="menu.manageAdmins">Admin Console</span>
        </a>
        <button type="button" class="nav-link" data-modal-open="terms-modal">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-file-text"></use></svg>
          <span data-i18n="nav.terms">Terms of Use</span>
        </button>
        <div class="dropdown" data-dropdown>
          <button type="button" class="nav-link" data-dropdown-toggle aria-expanded="false" aria-controls="guide-menu">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-book"></use></svg>
            <span data-i18n="nav.guide">User Guide</span>
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
          </button>

          <div class="menu guide-menu" id="guide-menu" data-dropdown-menu hidden>
            <div class="menu-section">
              <p class="guide-menu-heading" data-i18n="nav.guideTours">Page tours</p>
              <button type="button" class="menu-item" data-start-tour="profile">
                <svg class="icon" aria-hidden="true"><use href="#i-id-card"></use></svg>
                <span data-i18n="nav.tourProfile">Profile page tour</span>
              </button>
              <button type="button" class="menu-item" data-start-tour="booking">
                <svg class="icon" aria-hidden="true"><use href="#i-calendar-check"></use></svg>
                <span data-i18n="nav.tourBooking">Booking Center tour</span>
              </button>
              <button type="button" class="menu-item" data-start-tour="manageUsers" data-admin-only>
                <svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg>
                <span data-i18n="nav.tourManageUsers">Manage Users tour</span>
              </button>
            </div>
            <div class="menu-section">
              <a class="menu-item" href="guide.html">
                <svg class="icon" aria-hidden="true"><use href="#i-file-text"></use></svg>
                <span data-i18n="nav.guideDocs">Read the User Guide</span>
              </a>
            </div>
          </div>
        </div>
      </nav>

      <div class="dropdown" data-dropdown>
        <button type="button" class="avatar-button" data-dropdown-toggle aria-expanded="false" aria-controls="user-menu" data-i18n-aria-label="menu.open">
          <span class="avatar user-avatar avatar-sm" aria-hidden="true">AS</span>
          <span class="avatar-name" data-i18n="demo.userName">Anong Srisuk</span>
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
        </button>

        <div class="menu" id="user-menu" data-dropdown-menu hidden>
          <div class="menu-header">
            <span class="avatar user-avatar avatar-lg" aria-hidden="true">AS</span>
            <div>
              <strong data-i18n="demo.userName">Anong Srisuk</strong>
              <p class="menu-email">anong.s@cmu.ac.th</p>
              <a href="https://zoom.us/profile" target="_blank" rel="noopener" data-i18n="menu.editProfile">Edit Profile</a>
            </div>
          </div>

          <div class="menu-section menu-mobile-only">
            <a class="menu-item" href="booking.html">
              <svg class="icon" aria-hidden="true"><use href="#i-calendar-check"></use></svg>
              <span data-i18n="nav.booking">Booking Center</span>
            </a>
            <a class="menu-item" href="manage-users.html" aria-current="page" data-admin-only>
              <svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg>
              <span data-i18n="menu.manageUsers">Manage Users</span>
            </a>
            <a class="menu-item" href="manage-admins.html" data-global-only>
              <svg class="icon" aria-hidden="true"><use href="#i-shield"></use></svg>
              <span data-i18n="menu.manageAdmins">Admin Console</span>
            </a>
            <button type="button" class="menu-item" data-modal-open="terms-modal">
              <svg class="icon" aria-hidden="true"><use href="#i-file-text"></use></svg>
              <span data-i18n="nav.terms">Terms of Use</span>
            </button>
            <a class="menu-item" href="guide.html">
              <svg class="icon" aria-hidden="true"><use href="#i-book"></use></svg>
              <span data-i18n="nav.guide">User Guide</span>
            </a>
            <button type="button" class="menu-item" data-start-tour="profile">
              <svg class="icon" aria-hidden="true"><use href="#i-id-card"></use></svg>
              <span data-i18n="nav.tourProfile">Profile page tour</span>
            </button>
            <button type="button" class="menu-item" data-start-tour="booking">
              <svg class="icon" aria-hidden="true"><use href="#i-calendar-check"></use></svg>
              <span data-i18n="nav.tourBooking">Booking Center tour</span>
            </button>
            <button type="button" class="menu-item" data-start-tour="manageUsers" data-admin-only>
              <svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg>
              <span data-i18n="nav.tourManageUsers">Manage Users tour</span>
            </button>
          </div>

          <div class="menu-section">
            <div class="menu-row">
              <svg class="icon" aria-hidden="true"><use href="#i-globe"></use></svg>
              <span data-i18n="menu.language">Language</span>
              <div class="segmented" role="group" data-i18n-aria-label="menu.language">
                <button type="button" data-set-lang="en">EN</button>
                <button type="button" data-set-lang="th">TH</button>
              </div>
            </div>
            <div class="menu-row">
              <svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg>
              <span data-i18n="menu.theme">Theme</span>
              <div class="segmented" role="group" data-i18n-aria-label="menu.theme">
                <button type="button" data-set-theme="light" data-i18n-aria-label="menu.themeLight"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-sun"></use></svg></button>
                <button type="button" data-set-theme="dark" data-i18n-aria-label="menu.themeDark"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-moon"></use></svg></button>
              </div>
            </div>
          </div>

          <div class="menu-section">
            <a class="menu-item menu-item-danger" href="index.html" data-logout>
              <svg class="icon" aria-hidden="true"><use href="#i-log-out"></use></svg>
              <span data-i18n="menu.logout">Logout</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== 2. Manage Users ===== -->
  <!-- Mirrors production app/pages/manage-users.vue; manage-users.js fills the dynamic parts. -->
  <main class="page page-wide">
    <section class="card no-permission" data-no-permission hidden>
      <span class="modal-icon modal-icon-danger"><svg class="icon" aria-hidden="true"><use href="#i-lock"></use></svg></span>
      <h1 data-i18n="manage.noPermissionTitle"></h1>
      <p data-i18n="manage.noPermissionBody"></p>
      <a class="btn btn-primary" href="profile.html">
        <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>
        <span data-i18n="manage.backToProfile"></span>
      </a>
    </section>

    <div class="manage-grid" data-manage hidden>
      <div class="manage-side">
        <aside class="card quota-card" data-tour="quota" aria-labelledby="quota-title">
          <h2 id="quota-title" class="card-title" data-quota-title></h2>
          <div class="quota-list" data-quota-list></div>
        </aside>

        <section class="card expiry-card" data-tour="expiry" aria-labelledby="expiry-title">
          <h2 id="expiry-title" class="card-title" data-i18n="expiry.title"></h2>
          <div class="expiry-row">
            <p class="expiry-value">
              <svg class="icon" aria-hidden="true"><use href="#i-clock"></use></svg>
              <span data-expiry-value></span>
            </p>
            <!-- Global Admin only (manage-users.js hides it for org admins). -->
            <button type="button" class="icon-button expiry-edit" data-expiry-edit aria-haspopup="dialog" data-i18n-aria-label="expiry.editLabel" data-i18n-title="expiry.edit" hidden>
              <svg class="icon icon-sm" aria-hidden="true"><use href="#i-settings"></use></svg>
            </button>
          </div>
          <p class="expiry-desc" data-expiry-desc></p>
        </section>
      </div>

      <section class="card users-card" aria-labelledby="org-name">
        <div class="users-header">
          <div class="org-heading">
            <!-- A Global Admin picks the organization from the select, which already shows its name;
                 the heading stays for screen readers only. -->
            <h1 id="org-name" data-org-name></h1>
            <label class="visually-hidden" for="org-select" data-i18n="manage.organization"></label>
            <select id="org-select" class="select org-select" data-org-select hidden></select>
          </div>

          <form class="field" data-tour="user-search" role="search" data-search-form>
            <label class="visually-hidden" for="user-search" data-i18n="manage.search"></label>
            <input id="user-search" type="search" autocomplete="off" data-search data-i18n-placeholder="manage.search">
            <button type="submit" class="search-submit" data-i18n-aria-label="manage.searchSubmit" data-i18n-title="manage.searchSubmit">
              <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
            </button>
          </form>
        </div>

        <div class="table-scroll" data-tour="users-table">
          <table class="users-table manage-users-table">
            <thead>
              <tr>
                <!-- Multi-column sort: each click steps asc → desc → off; manage-users.js renders the indicators. -->
                <th scope="col" data-sort-header="name">
                  <button type="button" class="sort-button" data-sort="name"><span data-i18n="table.name"></span><span class="sort-indicator" aria-hidden="true" data-sort-indicator></span></button>
                </th>
                <th scope="col" class="col-account-type" data-sort-header="accountType">
                  <button type="button" class="sort-button" data-sort="accountType"><span data-i18n="table.accountType"></span><span class="sort-indicator" aria-hidden="true" data-sort-indicator></span></button>
                </th>
                <th scope="col" class="col-last-use" data-sort-header="lastUse">
                  <button type="button" class="sort-button" data-sort="lastUse"><span data-i18n="table.lastUse"></span><span class="sort-indicator" aria-hidden="true" data-sort-indicator></span></button>
                </th>
                <th scope="col" class="col-license" data-sort-header="license">
                  <button type="button" class="sort-button" data-sort="license"><span data-i18n="table.license"></span><span class="sort-indicator" aria-hidden="true" data-sort-indicator></span></button>
                </th>
              </tr>
            </thead>
            <tbody data-user-rows></tbody>
          </table>

          <div class="empty-state" data-empty hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
            <p data-i18n="manage.empty"></p>
            <button type="button" class="link-button" data-provision hidden></button>
          </div>
        </div>

        <div data-users-pagination></div>
      </section>
    </div>
  </main>

  <!-- ===== Modals ===== -->
  <dialog class="modal" id="terms-modal" aria-labelledby="terms-title">
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-icon"><svg class="icon" aria-hidden="true"><use href="#i-file-text"></use></svg></span>
        <h2 id="terms-title" data-i18n="terms.title">Zoom Pro Terms of Use</h2>
        <button type="button" class="icon-button" data-modal-close data-i18n-aria-label="modal.close">
          <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>
      <div class="modal-body">
        <!-- Content from "เงื่อนไขการใช้ ZOOM Pro.txt" plus the Pro expiration interval (terms.3 /
             terms.note3, not in that file); text lives in i18n.js (terms.*). -->
        <ol class="terms-list">
          <li data-i18n="terms.1"></li>
          <li data-i18n="terms.2"></li>
          <li data-i18n="terms.3"></li>
        </ol>
        <div class="terms-notes">
          <p class="terms-notes-title" data-i18n="terms.notesTitle">Notes</p>
          <ul>
            <li>
              <span data-i18n="terms.note1"></span>
              <a href="https://line.me/R/ti/p/@tliccmu" target="_blank" rel="noopener">@tliccmu</a>
            </li>
            <li data-i18n="terms.note2"></li>
            <li data-i18n="terms.note3"></li>
          </ul>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-modal-close data-i18n="terms.accept">I understand</button>
      </div>
    </div>
  </dialog>

  <!-- License modal (production LicenseModal.vue): filled by manage-users.js when a row is clicked. -->
  <dialog class="modal modal-wide" id="license-modal" aria-labelledby="license-modal-title">
    <div class="modal-panel">
      <div class="modal-header">
        <span class="avatar avatar-md" aria-hidden="true" data-lm-initials></span>
        <div class="modal-title-group">
          <h2 id="license-modal-title" data-lm-name></h2>
          <p class="modal-subtitle" data-lm-email></p>
        </div>
        <button type="button" class="icon-button" data-modal-close data-i18n-aria-label="modal.close">
          <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>

      <div class="modal-body">
        <section class="modal-section" aria-labelledby="license-modal-manage">
          <div class="modal-section-head">
            <h3 id="license-modal-manage" class="modal-section-title" data-i18n="licenseModal.license"></h3>
            <div class="current-license">
              <span class="modal-section-meta" data-i18n="licenseModal.current"></span>
              <span class="current-license-badges" data-lm-current></span>
            </div>
          </div>
          <div class="license-actions" data-lm-actions></div>
        </section>

        <section class="modal-section" aria-labelledby="license-modal-usage">
          <div class="modal-section-head">
            <h3 id="license-modal-usage" class="modal-section-title" data-i18n="licenseModal.usageTitle"></h3>
            <span class="modal-section-meta" data-lm-usage-count></span>
          </div>
          <div class="usage-log" data-lm-usage></div>
        </section>
      </div>
    </div>
  </dialog>

  <!-- Assign/Revoke confirmation, stacked on top of the license modal: text filled by manage-users.js. -->
  <dialog class="modal" id="confirm-license-modal" aria-labelledby="confirm-license-modal-title">
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-icon" data-cl-icon><svg class="icon" aria-hidden="true"><use href="#i-send"></use></svg></span>
        <h2 id="confirm-license-modal-title" data-cl-title></h2>
        <button type="button" class="icon-button" data-modal-close data-i18n-aria-label="modal.close">
          <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>
      <div class="modal-body" data-cl-body></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-modal-close data-i18n="modal.cancel"></button>
        <button type="button" class="btn" data-cl-confirm></button>
      </div>
    </div>
  </dialog>

  <!-- Pro expiration interval (Admin / Global Admin): radios filled by manage-users.js. -->
  <dialog class="modal" id="expiry-modal" aria-labelledby="expiry-modal-title">
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-icon"><svg class="icon" aria-hidden="true"><use href="#i-clock"></use></svg></span>
        <h2 id="expiry-modal-title" data-i18n="expiry.modalTitle"></h2>
        <button type="button" class="icon-button" data-modal-close data-i18n-aria-label="modal.close">
          <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>
      <div class="modal-body">
        <fieldset class="expiry-fieldset">
          <legend data-i18n="expiry.legend"></legend>
          <div class="expiry-options" data-expiry-options></div>
        </fieldset>
        <p class="modal-note" data-i18n="expiry.modalNote"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-modal-close data-i18n="modal.cancel"></button>
        <button type="button" class="btn btn-primary" data-expiry-save data-i18n="expiry.save"></button>
      </div>
    </div>
  </dialog>
</body>
</html>
